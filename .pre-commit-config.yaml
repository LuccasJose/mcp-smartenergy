minimum_pre_commit_version: "4.0.0"
exclude: ^(graphify-out/|dados/|outputs/|notebooks/|\.venv[^/]*/)
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff (erros estaticos)
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.15.22]
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
