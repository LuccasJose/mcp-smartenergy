[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smarty-energy-rl"
version = "0.1.0"
description = "Sistema Multi-Agentes com Q-Learning Cooperativo para gestão energética de fazendas de grãos"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "dash>=2.16",
    "plotly>=5.20",
    "mcp>=1.9.0,<2.0.0",
    "streamlit>=1.30",
    "click>=8.0,<8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mcp>=1.30.0,<2.0.0",
    "hypothesis>=6.100,<7",
    "ruff>=0.15,<0.16",
    "pre-commit>=4,<5",
    "coverage[toml]>=7.16,<8",
    "import-linter>=2.15,<3",
]
llm = ["anthropic>=0.40"]   # braço "LLM-direto" do benchmark

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["graphify-out", "notebooks", "outputs", "dados"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: testes lentos (treino longo/reprodutibilidade). Rode com '-m slow'.",
]
