[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smarty-energy-rl"
version = "0.1.0"
description = "Sistema Multi-Agentes com Q-Learning Cooperativo para gestão energética de fazendas de grãos"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "dash>=2.16",
    "plotly>=5.20",
    "mcp>=1.9.0,<2.0.0",
    "streamlit>=1.30",
    "click>=8.0,<8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mcp>=1.30.0,<2.0.0",
    "hypothesis>=6.100,<7",
    "ruff>=0.15,<0.16",
    "pre-commit>=4,<5",
    "coverage[toml]>=7.16,<8",
    "import-linter>=2.15,<3",
]
llm = ["anthropic>=0.40"]   # braço "LLM-direto" do benchmark

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["graphify-out", "notebooks", "outputs", "dados"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: testes lentos (treino longo/reprodutibilidade). Rode com '-m slow'.",
]

[tool.coverage.run]
branch = true
source = ["src/smarty_energy"]
relative_files = true

[tool.coverage.report]
include = [
    "src/smarty_energy/battery.py",
    "src/smarty_energy/environment.py",
    "src/smarty_energy/evaluation.py",
    "src/smarty_energy/training.py",
    "src/smarty_energy/runs.py",
    "src/smarty_energy/data_loader.py",
    "src/smarty_energy/mcp/server.py",
    "src/smarty_energy/mcp/state.py",
]
precision = 2
show_missing = true

[tool.coverage.json]
output = ".coverage-piloto.json"

[tool.importlinter]
root_package = "smarty_energy"

[[tool.importlinter.contracts]]
id = "motor-sem-adaptadores"
name = "A-DEP-001 Motor nao depende de adaptadores"
type = "forbidden"
source_modules = [
    "smarty_energy.config",
    "smarty_energy.battery",
    "smarty_energy.data_loader",
    "smarty_energy.agents",
    "smarty_energy.environment",
    "smarty_energy.training",
    "smarty_energy.evaluation",
    "smarty_energy.metrics",
    "smarty_energy.runs",
    "smarty_energy.data_splits",
    "smarty_energy.split_experiments",
]
forbidden_modules = [
    "smarty_energy.mcp",
    "smarty_energy.mcp_server",
    "smarty_energy.dashboard",
    "smarty_energy.dashboard_web",
    "smarty_energy.visualization",
    "smarty_energy.llm_policy",
    "smarty_energy.benchmark",
]

[[tool.importlinter.contracts]]
id = "estado-sem-servidor"
name = "A-DEP-002 Estado e auxiliares nao dependem do servidor"
type = "forbidden"
source_modules = [
    "smarty_energy.mcp.state",
    "smarty_energy.mcp.tracker",
    "smarty_energy.mcp.experiments",
]
forbidden_modules = ["smarty_energy.mcp.server"]

[[tool.importlinter.contracts]]
id = "backend-sem-clientes"
name = "A-DEP-003 Backend MCP nao depende de clientes"
type = "forbidden"
source_modules = [
    "smarty_energy.mcp.server",
    "smarty_energy.mcp.state",
    "smarty_energy.mcp.tracker",
    "smarty_energy.mcp.experiments",
]
forbidden_modules = [
    "smarty_energy.mcp.dashboard",
    "smarty_energy.mcp.judge_core",
    "smarty_energy.dashboard",
    "smarty_energy.dashboard_web",
    "smarty_energy.visualization",
    "smarty_energy.llm_policy",
    "smarty_energy.mcp_server",
    "smarty_energy.benchmark",
]

[[tool.importlinter.contracts]]
id = "clientes-sem-motor"
name = "A-DEP-004 Clientes MCP nao importam motor ou estado do servidor"
type = "forbidden"
source_modules = [
    "smarty_energy.mcp.dashboard",
    "smarty_energy.mcp.judge_core",
]
forbidden_modules = [
    "smarty_energy.config",
    "smarty_energy.battery",
    "smarty_energy.data_loader",
    "smarty_energy.agents",
    "smarty_energy.environment",
    "smarty_energy.training",
    "smarty_energy.evaluation",
    "smarty_energy.metrics",
    "smarty_energy.runs",
    "smarty_energy.data_splits",
    "smarty_energy.split_experiments",
    "smarty_energy.mcp.server",
    "smarty_energy.mcp.state",
    "smarty_energy.mcp.tracker",
    "smarty_energy.mcp.experiments",
]
